<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIRRIÑAO — Recorrido VR</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
    .btn {
      position: fixed; pointer-events: auto; text-decoration: none;
      background: rgba(0,0,0,0.55); border: 1px solid rgba(142, 104, 73,0.25);
      color: rgba(142, 104, 73,0.9); backdrop-filter: blur(12px);
      border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    #back { top: 16px; left: 16px; }
    #title {
      top: 16px; left: 50%; transform: translateX(-50%); position: fixed;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(142, 104, 73,0.18);
      color: #FFF9E9; backdrop-filter: blur(12px); border-radius: 999px;
      padding: 8px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    }
    #enter {
      bottom: 28px; left: 50%; transform: translateX(-50%); position: fixed; pointer-events: auto;
      background: #8E6849; color: #FFF9E9; border: none; border-radius: 16px;
      padding: 16px 30px; font-size: 17px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 28px rgba(142, 104, 73,0.45);
    }
  </style>
</head>
<body>
  <a-scene
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true; antialias: true"
    loading-screen="dotsColor: #8E6849; backgroundColor: #0a0a0a"
    background="transparent: true">

    <a-assets timeout="15000" id="assets"></a-assets>

    <!-- Cielo: radius 50 para no exceder el far plane del Quest -->
    <a-sky id="sky" radius="50"></a-sky>

    <!-- Hotspots se inyectan aquí -->
    <a-entity id="hotspots"></a-entity>

    <!-- Cámara + cursor de mirada -->
    <a-camera id="cam" wasd-controls-enabled="false" position="0 1.6 0">
      <a-entity cursor="fuse: false"
        position="0 0 -1.4"
        geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
        material="color: #8E6849; shader: flat; opacity: 0.7"
        raycaster="objects: .clickable"></a-entity>
    </a-camera>

    <!-- Mandos del Quest con láser apuntador -->
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #8E6849; lineOpacity: 0.85"></a-entity>
    <a-entity laser-controls="hand: left"  raycaster="objects: .clickable; lineColor: #8E6849; lineOpacity: 0.85"></a-entity>
  </a-scene>

  <!-- Overlay 2D (no visible dentro del modo inmersivo) -->
  <div id="ui">
    <a id="back" class="btn" href="./">◀ Salir de VR</a>
    <div id="title">Recorrido VR</div>
  </div>
  <button id="enter">🥽 Entrar en Modo VR</button>

  <script>
    // ── Calibración (ajustar al probar en el Quest) ──
    var YAW_OFFSET = 0;        // rota los hotspots si no alinean con el panorama
    var SKY_MIRRORED = false;  // espeja el panorama si se ve al revés
    var SKY_RADIUS = 50;
    var HOTSPOT_R = 8;

    // ── Datos del recorrido (MIRRIÑAO — Casa Grande, 2 pisos · 10 escenas) ──
    // Rutas RELATIVAS: funcionan con o sin basePath (GitHub Pages /NEXARQ/).
    // Las claves cortas ('acceso', 'sala', ...) coinciden con VR_SCENE_MAP de
    // left-sidebar.tsx (cg-<clave> → <clave>). Los yaw/pitch están portados del
    // tour.config.ts (primera pasada); afinar probando en el Quest.
    var BASE = 'projects/melendez/mirrinao/panoramas/casa-grande/vr/';
    var SCENES = {
      // ══════════ PRIMER PISO ══════════
      'acceso': { name: 'Acceso', img: BASE+'acceso.jpg', hotspots: [
        { label:'Sala', yaw:-102.2, pitch:-1.9, to:'sala' },
        { label:'Comedor', yaw:-72.1, pitch:-2.9, to:'comedor' },
        { label:'Patio Exterior', yaw:-90.9, pitch:-0.3, to:'patio-exterior' } ] },
      'sala': { name: 'Sala', img: BASE+'sala.jpg', hotspots: [
        { label:'Acceso', yaw:76.5, pitch:-1.3, to:'acceso' },
        { label:'Comedor', yaw:2.4, pitch:-0.2, to:'comedor' },
        { label:'Segundo Piso', yaw:85.3, pitch:-9.8, to:'bano-social' },
        { label:'Patio Exterior', yaw:-71.6, pitch:-5.7, to:'patio-exterior' } ] },
      'comedor': { name: 'Comedor', img: BASE+'comedor.jpg', hotspots: [
        { label:'Cocina y Patio', yaw:88.3, pitch:0.7, to:'cocina-patio' },
        { label:'Segundo Piso', yaw:121.8, pitch:0.6, to:'bano-social' },
        { label:'Sala', yaw:162.6, pitch:-1.6, to:'sala' },
        { label:'Acceso', yaw:102.2, pitch:-0.9, to:'acceso' } ] },
      'cocina-patio': { name: 'Cocina y Patio', img: BASE+'cocina-patio.jpg', hotspots: [
        { label:'Comedor', yaw:-86.6, pitch:-1.2, to:'comedor' } ] },
      'patio-exterior': { name: 'Patio Exterior', img: BASE+'patio-exterior.jpg', hotspots: [
        { label:'Sala', yaw:110.4, pitch:-2.2, to:'sala' } ] },
      // ══════════ SEGUNDO PISO ══════════
      'alcoba-principal': { name: 'Alcoba Principal', img: BASE+'alcoba-principal.jpg', hotspots: [
        { label:'Baño Social', yaw:-62.1, pitch:-1.1, to:'bano-social' },
        { label:'Baño Principal', yaw:77.6, pitch:-0.8, to:'bano-principal' },
        { label:'Alcoba Auxiliar 2', yaw:-78.5, pitch:-2.4, to:'alcoba-auxiliar-2' },
        { label:'Alcoba Auxiliar 1', yaw:-95.7, pitch:-2.2, to:'alcoba-auxiliar-1' } ] },
      'bano-principal': { name: 'Baño Principal', img: BASE+'bano-principal.jpg', hotspots: [
        { label:'Alcoba Principal', yaw:170, pitch:-3, to:'alcoba-principal' } ] },
      'alcoba-auxiliar-1': { name: 'Alcoba Auxiliar 1', img: BASE+'alcoba-auxiliar-1.jpg', hotspots: [
        { label:'Alcoba Principal', yaw:77.8, pitch:-1.1, to:'alcoba-principal' },
        { label:'Baño Social', yaw:57.5, pitch:-1.7, to:'bano-social' } ] },
      'alcoba-auxiliar-2': { name: 'Alcoba Auxiliar 2', img: BASE+'alcoba-auxiliar-2.jpg', hotspots: [
        { label:'Baño Social', yaw:62.7, pitch:-0.7, to:'bano-social' },
        { label:'Alcoba Principal', yaw:84.4, pitch:-0.4, to:'alcoba-principal' } ] },
      'bano-social': { name: 'Baño Social', img: BASE+'bano-social.jpg', hotspots: [
        { label:'Alcoba Principal', yaw:117.1, pitch:-0.8, to:'alcoba-principal' },
        { label:'Alcoba Auxiliar 2', yaw:-115.2, pitch:-2.2, to:'alcoba-auxiliar-2' },
        { label:'Alcoba Auxiliar 1', yaw:-157.9, pitch:-2.7, to:'alcoba-auxiliar-1' },
        { label:'Primer Piso', yaw:141.1, pitch:-21.6, to:'sala' } ] }
    };

    // pitch/yaw (grados) → posición XYZ
    function pos(yawDeg, pitchDeg, r) {
      var yaw = (yawDeg + YAW_OFFSET) * Math.PI / 180;
      var p = pitchDeg * Math.PI / 180;
      var sign = SKY_MIRRORED ? -1 : 1;
      return [sign * r * Math.cos(p) * Math.sin(yaw), r * Math.sin(p), -r * Math.cos(p) * Math.cos(yaw)];
    }

    // Componente: orientar el hotspot hacia el centro (cámara)
    AFRAME.registerComponent('look-center', {
      init: function () {
        var el = this.el;
        setTimeout(function () {
          var o = el.object3D;
          o.lookAt(0, o.position.y, 0);
          o.rotateY(Math.PI);
        }, 0);
      }
    });

    var sky = document.getElementById('sky');
    var hsRoot = document.getElementById('hotspots');
    var titleEl = document.getElementById('title');

    function loadScene(id) {
      var sc = SCENES[id];
      if (!sc) return;
      sky.setAttribute('src', sc.img);
      sky.setAttribute('material', 'shader: flat; src: ' + sc.img);
      if (SKY_MIRRORED) sky.setAttribute('scale', '-1 1 1');
      titleEl.textContent = sc.name;

      while (hsRoot.firstChild) hsRoot.removeChild(hsRoot.firstChild);

      sc.hotspots.forEach(function (h) {
        var p = pos(h.yaw, h.pitch, HOTSPOT_R);
        var el = document.createElement('a-entity');
        el.setAttribute('position', p[0] + ' ' + p[1] + ' ' + p[2]);
        el.setAttribute('look-center', '');
        // Área de clic: geometría circular transparente para que el raycaster
        // del mando (objects: .clickable) detecte el hotspot. Sin un mesh propio
        // el raycaster no intersecta (los visuales son hijos aparte).
        el.classList.add('clickable');
        el.setAttribute('geometry', 'primitive: circle; radius: 0.7');
        el.setAttribute('material', 'opacity: 0; transparent: true; side: double');

        var disc = document.createElement('a-circle');
        disc.setAttribute('radius', '0.55');
        disc.setAttribute('material', 'color: #0a0a0a; shader: flat; opacity: 0.55; side: double');
        el.appendChild(disc);

        var ring = document.createElement('a-ring');
        ring.setAttribute('radius-inner', '0.45');
        ring.setAttribute('radius-outer', '0.55');
        ring.setAttribute('material', 'color: #8E6849; shader: flat; side: double');
        el.appendChild(ring);

        var bg = document.createElement('a-plane');
        bg.setAttribute('position', '0 -0.9 0');
        bg.setAttribute('width', String(Math.max(1.2, h.label.length * 0.22 + 0.5)));
        bg.setAttribute('height', '0.42');
        bg.setAttribute('material', 'color: #0a0a0a; shader: flat; opacity: 0.7; side: double');
        el.appendChild(bg);

        var txt = document.createElement('a-text');
        txt.setAttribute('value', h.label.toUpperCase());
        txt.setAttribute('align', 'center');
        txt.setAttribute('position', '0 -0.9 0.02');
        txt.setAttribute('color', '#FFF9E9');
        txt.setAttribute('width', '5');
        el.appendChild(txt);

        el.addEventListener('mouseenter', function(){ el.setAttribute('scale','1.18 1.18 1.18'); });
        el.addEventListener('mouseleave', function(){ el.setAttribute('scale','1 1 1'); });
        el.addEventListener('click', function () { loadScene(h.to); });

        hsRoot.appendChild(el);
      });
    }

    // Precargar imágenes en a-assets
    var assets = document.getElementById('assets');
    Object.keys(SCENES).forEach(function (id) {
      var img = document.createElement('img');
      img.setAttribute('crossorigin', 'anonymous');
      img.src = SCENES[id].img;
      assets.appendChild(img);
    });

    // Escena inicial (?scene=acceso por defecto)
    var params = new URLSearchParams(location.search);
    var start = params.get('scene') || 'acceso';
    var sceneEl = document.querySelector('a-scene');
    if (sceneEl.hasLoaded) loadScene(start);
    else sceneEl.addEventListener('loaded', function(){ loadScene(start); });

    // Botón propio "Entrar en Modo VR"
    document.getElementById('enter').addEventListener('click', function () {
      sceneEl.enterVR();
    });
    sceneEl.addEventListener('enter-vr', function(){ document.getElementById('enter').style.display = 'none'; });
    sceneEl.addEventListener('exit-vr',  function(){ document.getElementById('enter').style.display = ''; });
  </script>
</body>
</html>
